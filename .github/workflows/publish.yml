# The EV model, running on GitHub.
#
# Every run: pull the live league off ESPN, re-price all twelve seasons, append a
# point to the tape if anything moved, and republish the page. No machine of ours
# has to be awake.
#
# THE PAGE IS OPEN. There is no password: anyone with the link sees the league,
# and since this repository is public so is everything in it. That is a decision,
# not an oversight — the audience is the whole league and the friction was not
# worth it. Nothing here is a credential; the model reads ESPN's public league
# endpoints and writes numbers.
#
# ── one-time setup ────────────────────────────────────────────────────────────
#  1. Settings → Pages → Source: **GitHub Actions**
#  2. Settings → Secrets and variables → Actions → Variables:
#       ESPN_LEAGUE_ID   the league id
#       ESPN_SEASON      e.g. 2026
name: Publish EV

on:
  schedule:
    # game windows, UTC (ET + 4). Minutes offset off :00, which GitHub queues hardest.
    - cron: "3,18,33,48 17-23 * * 0"    # Sunday afternoon
    - cron: "3,18,33,48 0-4 * * 1"      # Sunday night
    - cron: "3,18,33,48 0-4 * * 2"      # Monday night
    - cron: "3,18,33,48 0-4 * * 5"      # Thursday night
    # the rest of the week: waivers, trades and injury news move the number too
    - cron: "23 */3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "evmodel/**"
      - "scripts/**"
      - "web/**"
      - ".github/workflows/publish.yml"

permissions:
  contents: write      # to commit the encrypted tape
  pages: write
  id-token: write

concurrency:
  group: ev-publish
  cancel-in-progress: false

env:
  # a variable is enough now; a secret with the same name still works
  ESPN_LEAGUE_ID: ${{ vars.ESPN_LEAGUE_ID || secrets.ESPN_LEAGUE_ID }}
  ESPN_SEASON: ${{ vars.ESPN_SEASON || 2026 }}
  # The management overlay: {"Owner": factor}, secret so the published numbers
  # can carry it without the definition ever entering the repository. Unset is a
  # no-op, and any uniform setting is identity, so there is nothing to clean up
  # when it is off.
  EV_TEAM_BIAS: ${{ secrets.EV_TEAM_BIAS }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install --quiet -r requirements.txt

      - name: Check the league is configured
        run: |
          if [ -z "$ESPN_LEAGUE_ID" ]; then
            echo "::error::ESPN_LEAGUE_ID is not set (Settings → Variables)."
            exit 1
          fi

      # One run, several snapshots. The cron asks for a tick every 15 minutes
      # during games and GitHub honours almost none of it -- scheduled workflows
      # are the first thing dropped when the shared runners are busy, and on the
      # Sunday of week 4 the tape got two points five hours apart against a
      # schedule asking for twenty. Four separate runs an hour is the fragile
      # shape; one run that loops inside itself is not, because once a runner is
      # allocated nobody can take it away. So a live week sweeps for most of an
      # hour and the next cron picks up wherever this one stopped.
      - name: Price the season
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          SWEEPS=4
          ok=0
          for i in $(seq 1 $SWEEPS); do
            # A sweep is allowed to fail. ESPN times out, a rebase loses a race,
            # and none of that should cost the site its deploy -- the step failing
            # SKIPS "Build the page" and the whole deploy job, which is how nine
            # hours of stale site hid behind a healthy-looking tape. The run only
            # fails if every sweep failed, which is a real outage worth a red X.
            if ! python scripts/record_snapshot.py; then
              echo "sweep $i: snapshot failed; carrying on"
              if [ "$i" -lt "$SWEEPS" ]; then sleep 900; fi
              continue
            fi
            ok=$((ok + 1))
            # espn_weekly.json is the cached forward grid. It MUST ride back into
            # the repo: the runner starts from a fresh checkout every time, so an
            # uncommitted cache is no cache at all and each run would pull all
            # ~37 MB of it again.
            git add data/ev_history.json data/projection_log.json data/espn_weekly.json
            if git diff --cached --quiet; then
              echo "sweep $i: nothing moved"
            else
              git commit -m "tape: snapshot $(date -u +'%Y-%m-%d %H:%M UTC') [skip ci]"
              git pull --rebase --autostash origin main || true
              git push || echo "sweep $i: push lost a race; the next sweep carries it"
            fi
            # Only AFTER the first snapshot, because params.json is gitignored and
            # does not exist on a fresh runner -- testing it before this point
            # always reads "no live week" and quietly collapses the sweep to one.
            if [ "$i" = "1" ]; then
              live=$(python -c 'import json;\
          d=json.load(open("data/params.json"));\
          print("1" if any(w["state"]=="live" for w in d["weeks"]) else "0")' 2>/dev/null || echo 0)
              if [ "$live" != "1" ]; then
                echo "no live week -> one sweep is enough"
                break
              fi
              echo "live week -> sweeping $SWEEPS times, 15 minutes apart"
            fi
            # A plain `[ ... ] && sleep` here is a trap: on the last pass the
            # test is false, the && chain returns 1, and that is the loop's exit
            # status, so the step fails under bash -e AFTER doing all its work.
            # That is exactly what happened -- four sweeps pushed, then exit 1,
            # and "Build the page" plus the deploy were skipped for nine hours
            # while the tape looked healthy.
            if [ "$i" -lt "$SWEEPS" ]; then sleep 900; fi
          done
          echo "$ok of $SWEEPS sweep(s) landed"
          [ "$ok" -gt 0 ] || { echo "::error::every sweep failed"; exit 1; }

      - name: Build the page
        run: |
          python scripts/build_app.py --out _site/index.html
          cp data/params.json _site/ev_season.json
          cp data/ev_history.json _site/ev_history.json
          # open to anyone with the link, but not worth putting in a search index
          printf 'User-agent: *\nDisallow: /\n' > _site/robots.txt

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
